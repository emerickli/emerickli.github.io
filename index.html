  <script defer>
  (function () {
    var dur = 90000;
    var key = "city-spin-start";
    try {
      var now = Date.now();
      var start = Number(sessionStorage.getItem(key));
      if (!start) {
        start = now;
        sessionStorage.setItem(key, String(start));
      }
      var elapsed = (now - start) % dur;
      document.documentElement.style.setProperty("--spin-delay", (-elapsed / 1000) + "s");
    } catch (err) {}
  })();
  </script>
