  <script defer>
  (function () {
    var dur = 90000;
    var runKey = "city-spin-run";
    var startKey = "city-spin-start";
    var offsetKey = "city-spin-offset";
    var root = document.documentElement;
    function place(offset) {
      var turn = ((offset % dur) / dur) * 360;
      root.style.setProperty("--spin-angle", turn.toFixed(3));
      root.style.setProperty("--spin-delay", (-(offset % dur) / 1000) + "s");
    }
    try {
      var running = sessionStorage.getItem(runKey) === "1";
      var offset = Number(sessionStorage.getItem(offsetKey)) || 0;
      if (running) {
        var start = Number(sessionStorage.getItem(startKey));
        if (!start) {
          start = Date.now();
          sessionStorage.setItem(startKey, String(start));
        }
        offset = (Date.now() - start) % dur;
        root.classList.add("playing");
      }
      place(offset);
    } catch (err) {}

    document.addEventListener("DOMContentLoaded", function () {
    var box = document.getElementById("hold");
    if (!box) return;
    box.checked = !root.classList.contains("playing");
    box.addEventListener("change", function () {
        if (box.checked) {
          try {
            var start = Number(sessionStorage.getItem(startKey)) || Date.now();
            var offset = (Date.now() - start) % dur;
            sessionStorage.setItem(offsetKey, String(offset));
            sessionStorage.setItem(runKey, "0");
            place(offset);
          } catch (err) {}
          root.classList.remove("playing");
        } else {
          try {
            var held = Number(sessionStorage.getItem(offsetKey)) || 0;
            sessionStorage.setItem(startKey, String(Date.now() - held));
            sessionStorage.setItem(runKey, "1");
            place(held);
          } catch (err) {}
          root.classList.add("playing");
        }
      });
    });

    var revealed = false;
    function reveal() {
      if (revealed) return;
      revealed = true;
      document.body.classList.remove("booting");
    }
    function warm() {
      var imgs = document.querySelectorAll(".sign");
      var jobs = [];
      for (var i = 0; i < imgs.length; i++) {
        (function (img) {
          if (typeof img.decode === "function") {
            jobs.push(img.decode().catch(function () {}));
          } else if (img.complete) {
            jobs.push(Promise.resolve());
          } else {
            jobs.push(new Promise(function (done) {
              img.addEventListener("load", done, { once: true });
              img.addEventListener("error", done, { once: true });
            }));
          }
        })(imgs[i]);
      }
      Promise.all(jobs).then(function () {
        var stage = document.querySelector(".stage");
        if (stage) stage.getBoundingClientRect();
        requestAnimationFrame(function () {
          requestAnimationFrame(reveal);
        });
      });
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", warm);
    else warm();
    window.setTimeout(reveal, 4000);
  })();
  </script>
