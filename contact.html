<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact, Jules Okonkwo</title>
  <meta name="description" content="Leave a note for Jules Okonkwo. The note stays in this browser and is not sent.">
  <meta name="theme-color" content="#070303">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css?v=31">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="wireframe" aria-hidden="true">
    <img src="assets/img/wire.svg?v=3" alt="">
  </div>
  <a class="skip" href="#content">Skip to content</a>
  <header class="mast">
    <div class="wrap mast-inner">
      <a class="brand" href="index.html">Jules Okonkwo</a>
      <nav aria-label="Site">
        <a href="index.html">Home</a>
        <a href="work.html">Work</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>
  <main id="content" class="wrap page">
    <div class="split signal">
      <figure class="plate plate-portrait">
        <span class="screw" aria-hidden="true"></span>
        <span class="screw" aria-hidden="true"></span>
        <span class="screw" aria-hidden="true"></span>
        <span class="screw" aria-hidden="true"></span>
        <div class="well">
          <img src="assets/frames/id.svg?v=3" alt="Empty photo frame" width="600" height="800">
        </div>
      </figure>
      <div>
        <h1>Contact</h1>
        <p class="lead">Leave a note for Jules Okonkwo. The note stays in this browser and is not sent anywhere.</p>
        <form id="signal-form" class="signal-form">
          <div>
            <label for="note-name">Name</label>
            <input id="note-name" name="name" type="text" autocomplete="name" required>
          </div>
          <div>
            <label for="note-email">Email</label>
            <input id="note-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div>
            <label for="note-message">Message</label>
            <textarea id="note-message" name="message" required></textarea>
          </div>
          <div>
            <button class="button" id="hold-note" type="button">Save note</button>
          </div>
        </form>
        <p class="status" id="note-status" role="status">No note saved.</p>
        <p class="held" id="note-held" hidden></p>
        <noscript>
          <p>Turn on JavaScript to save a note in this browser.</p>
        </noscript>
      </div>
    </div>
  </main>
  <footer class="colophon">
    <div class="wrap">
      <p>© 2026 Jules Okonkwo</p>
    </div>
  </footer>
  <script src="assets/js/site.js?v=17"></script>
</body>
</html>
